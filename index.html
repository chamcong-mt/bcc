const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.salt), iterations:ENC.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.iv)}, key, b64(ENC.ct));
  return new TextDecoder().decode(pt);
}
async function go(){
  const pw = document.getElementById("pw").value, btn = document.getElementById("go"), err = document.getElementById("err");
  if (!pw) return;
  if (!(window.crypto && crypto.subtle)) { err.textContent = "Trình duyệt này không hỗ trợ mở báo cáo. Hãy mở link bằng Safari hoặc Chrome."; return; }
  btn.disabled = true; btn.textContent = "Đang mở…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { localStorage.setItem("bc_cc_pw", pw); } catch(e) {}
    document.open(); document.write(html); document.close();
  } catch(e) {
    btn.disabled = false; btn.textContent = "Mở báo cáo"; err.textContent = "Sai mật khẩu."; try { localStorage.removeItem("bc_cc_pw"); } catch(e2) {}
  }
}
document.getElementById("go").onclick = go;
document.getElementById("eye").onclick = () => { const i = document.getElementById("pw"), e = document.getElementById("eye"), show = i.type === "password"; i.type = show ? "text" : "password"; e.textContent = show ? "Ẩn" : "Hiện"; e.setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu"); i.focus(); };
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
try { const s = localStorage.getItem("bc_cc_pw"); if (s) { document.getElementById("pw").value = s; go(); } } catch(e) {}
